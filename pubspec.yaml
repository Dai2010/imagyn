name: imagyn
description: A minimal multilingual AI image studio for mobile and desktop.
publish_to: none
version: 0.1.4+5
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: 5.9.0
  http_parser: 4.1.2
  file_selector: 1.0.3
  flutter_secure_storage: 9.2.4
  image: 4.5.4
  path: 1.9.1
  path_provider: 2.1.5
  sqflite: 2.4.2
  sqflite_common_ffi: 2.4.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
flutter:
  uses-material-design: true
