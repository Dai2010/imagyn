# Analyse and unit-test the Dart code on every pull request and on main.
# This job never touches signing keys, and it needs no platform folder: the
# tests exercise the protocol adapters, the config model and the translations.
name: check

on:
  push:
    branches: [main]
  pull_request:
  # A pull request does not always produce a run (seen twice), and this job is
  # the only thing that compiles the Dart, so it can also be started by hand
  # against any branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: python3 -m unittest discover -s test -p '*_test.py' -v

      # Pinned to 3.47.9: stable 3.50.0 deprecated package:flutter/material.dart,
      # causing `flutter analyze` (which fails on info lints) to exit 1 before
      # the tree migrates to package:material_ui/material_ui.dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # `dart format` is not enforced yet: the tree has never been through a
      # real formatter, so a --set-exit-if-changed gate would fail on
      # formatting alone. Run `dart format .` once a local SDK exists, commit
      # that, and only then add the gate.
      # Measured on stable 3.47.7: `flutter analyze` exits non-zero on info-level
      # lints as well, not just errors and warnings. The tree therefore has to
      # stay lint-clean for this gate to pass.
      - run: flutter analyze
      - run: flutter test --reporter expanded
