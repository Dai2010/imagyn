# Build the Android APK on every push to main. A manual run (workflow_dispatch)
# additionally builds the three desktop platforms, packages them, and attaches
# everything to a GitHub prerelease: the artifacts then travel inside GitHub and
# the published assets can be fetched through a download mirror, which the
# Actions artifact API cannot be.
#
# Signing: only the Android APK is signed, and with the preview keystore so a
# later preview can install over this one. Without those secrets it falls back
# to the runner's throwaway debug key, which changes on every job. release.yml
# is the path that produces the properly signed release APK, and it refuses to
# run without the release keystore. The desktop packages
# are unsigned, so Windows SmartScreen and macOS Gatekeeper warn on first run —
# the release notes say so rather than hiding it. Windows is x64 only: Flutter
# ships no 32-bit Windows embedder.
name: build

on:
  push:
    branches: [main]
  # A manual run can attach the packages to a GitHub prerelease. A preview tag
  # is the version plus a suffix — v0.3.0-preview2 — which release.yml ignores,
  # so a formal release and a preview never share an entry point.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for the prerelease, e.g. v0.3.0-preview2'
        required: true
        default: 'v0.3.0-preview'
      title:
        description: 'Release title'
        required: false
        default: 'Imagyn 预览版（Android / Linux / Windows / macOS）'

permissions:
  contents: read

concurrency:
  # Keyed on the event as well as the ref, so a manual run does not queue behind
  # — or cancel — the build that a push to main just started.
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: python3 scripts/scaffold_platforms.py android --preview
      - run: flutter pub get

      # A release build rather than a debug one: this artifact exists to be
      # installed and judged on a real phone, and a debug APK is noticeably
      # slower and twice the size. Signing is handled by the step above — the
      # stable preview key when the secrets are configured, otherwise the
      # runner's throwaway debug key, which changes on every job.
      - run: flutter build apk --release

      # Re-signed here instead of through a signing config injected into the
      # generated build.gradle.kts. That injection failed in CI and would have to
      # track Flutter's template shape; re-signing does not, and the exact
      # commands below were run against the real key and this APK before being
      # wired in here.
      - name: Re-sign the APK with the preview key
        env:
          KEYSTORE: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::no preview key configured; the APK keeps this runner's debug signature and will not install over an earlier preview"
            exit 0
          fi
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/preview.jks"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/preview.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          mv "$RUNNER_TEMP/signed.apk" "$apk"
          "$tools/apksigner" verify --print-certs "$apk"

      # Flutter names the output app-release.apk, which on a prerelease page
      # reads like the official build. The asset name is what survives the
      # download, so it has to say what it is.
      - name: Name the APK as a preview
        run: |
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          name="Imagyn-preview-${version//+/_}.apk"
          cd build/app/outputs/flutter-apk
          mv app-release.apk "$name"
          ls -l

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: build/app/outputs/flutter-apk/Imagyn-preview-*.apk
          if-no-files-found: error

  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # libsecret-1-dev and libjsoncpp-dev are what flutter_secure_storage's
      # Linux plugin finds through pkg-config; without them the CMake configure
      # step of `flutter build linux` fails outright on a clean runner.
      # rpm and libarchive-tools carry rpmbuild and bsdtar for packaging.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev rpm libarchive-tools

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - id: version
        run: echo "value=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - run: python3 scripts/scaffold_platforms.py linux
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/package_linux.sh build/linux/x64/release/bundle "${{ steps.version.outputs.value }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the packaging tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # WiX v5 and newer refuse to build until the Open Source Maintenance
          # Fee EULA is accepted (error WIX7015) — a licensing decision this
          # project cannot make on the runner. v4 is the last line that builds
          # without it, and the packaging script generates the file components the .wxs
          # uses.
          dotnet tool install --global wix --version 4.*

      - shell: bash
        run: python scripts/scaffold_platforms.py windows
      - shell: bash
        run: flutter pub get
      - shell: bash
        run: flutter build windows --release
      - shell: pwsh
        run: |
          $line = (Select-String -Path pubspec.yaml -Pattern '^version:').Line
          $version = $line.Split(' ')[1].Split('+')[0]
          ./scripts/package_windows.ps1 -Bundle build/windows/x64/runner/Release `
            -Version $version -Out dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - id: version
        run: echo "value=$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)" >> "$GITHUB_OUTPUT"

      - run: python3 scripts/scaffold_platforms.py macos
      - run: flutter pub get
      - run: flutter build macos --release
      - run: scripts/package_macos.sh build/macos/Build/Products/Release/imagyn.app "${{ steps.version.outputs.value }}" dist

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish-apk:
    # Publishes the APK the moment it exists. On the phone's network the Actions
    # artifact API cannot be used to fetch it, so the release asset is how it
    # travels — and waiting for the three desktop builds would delay it by ten
    # minutes for nothing. The full `publish` job below rewrites this release's
    # notes and adds the desktop packages once they are ready.
    if: github.event_name == 'workflow_dispatch'
    needs: android
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: android
          path: dist

      - name: Checksum and release notes
        run: |
          cd dist
          sha256sum -- *.apk > SHA256SUMS
          cat SHA256SUMS
          digest="$(awk '{print $1}' SHA256SUMS)"
          {
            echo "**这是预览版，不是正式发布。**"
            echo
            echo "签名：**预览通道密钥**；包名是 \`app.imagyn.preview\`，标签带「预览」，是独立应用，可以和正式版同时安装、互不覆盖，设置与密钥需在预览版里重新填一次。"
            echo
            echo "来源：\`build\` 流水线 #${{ github.run_id }}，提交 \`${{ github.sha }}\`。"
            echo
            echo "- minSdk 24（Android 7.0+），fat APK（arm64-v8a / armeabi-v7a / x86_64）"
            echo "- sha256: $digest"
            echo
            echo "国内下载：在附件地址前加 https://ghfast.top/ 前缀即可。"
            echo
            echo "桌面三平台（deb / rpm / Arch、MSI / EXE、DMG / PKG）构建完成后会补进本页。"
          } > ../NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          prerelease: true
          body_path: NOTES.md
          files: dist/*

  publish:
    # Manual runs only: an ordinary push to main should not keep minting releases.
    # `always()` so that one broken platform cannot hold the whole release
    # hostage: whatever did build gets published, and the notes list the files
    # that actually exist rather than the ones that were meant to.
    # Finish the APK-only publication before replacing its notes and checksums.
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    needs: [android, linux, windows, macos, publish-apk]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Every artifact is fetched from GitHub's own storage, so nothing here
      # depends on the machine that will end up downloading the release.
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and release notes
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          digest="$(awk '{print $1}' SHA256SUMS)"
          {
            echo "**这是预览版，不是正式发布。**"
            echo
            echo "来源：\`build\` 流水线 #${{ github.run_id }}，提交 \`${{ github.sha }}\`。"
            echo
            echo "## 签名状态"
            echo
            echo "- **Android APK** —— 用**预览通道密钥**签名，包名 \`app.imagyn.preview\`（正式版是 \`app.imagyn\`），因此两者可以同时装在一台手机上，数据与设置各自独立。"
            echo "- **Windows MSI / EXE、macOS DMG / PKG、Linux deb / rpm / Arch** —— **未签名**。Windows SmartScreen 会提示未知发布者，macOS 需要右键打开。消除这一点需要 Authenticode 证书与 Apple Developer ID，两个都还没有。"
            echo "- **Windows 只有 64 位**：Flutter 不提供 32 位 Windows 目标。"
            echo
            echo "## 附件（本次实际产出的文件）"
            echo
            ls -1 | sed 's/^/- /'
            echo
            echo "## 国内下载"
            echo
            echo "在任意附件地址前加 https://ghfast.top/ 前缀即可。"
            echo
            echo "## 已知限制"
            echo
            echo "未与真实接口联调：能不能出图取决于你自己配置的 OpenAI / Anthropic 兼容服务。"
            echo
            echo "## 校验"
            echo
            echo "全部附件的 sha256 见 \`SHA256SUMS\`。"
          } > ../NOTES.md

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.title }}
          prerelease: true
          body_path: NOTES.md
          files: dist/*
