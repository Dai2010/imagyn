# Publish a release: the signed Android APK plus the Linux, Windows and macOS
# packages. Triggered by a v* tag; a manual dispatch from a branch fails in the
# guard job, because the publish step needs a tag.
#
# Only the Android APK is signed. The desktop packages are unsigned — there is
# no Authenticode certificate and no Apple Developer ID — so Windows
# SmartScreen and macOS Gatekeeper warn on first run. The release notes say so
# instead of hiding it.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Require a v* tag that agrees with pubspec.yaml
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow publishes a release, so it has to run on a tag."
            echo "Create one with: git tag v0.1.0 && git push origin v0.1.0"
            exit 1
          fi
          declared="$(grep -m1 '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)"
          tagged="${GITHUB_REF_NAME#v}"
          if [ "$declared" != "$tagged" ]; then
            echo "::error::the tag is $tagged but pubspec.yaml declares $declared"
            exit 1
          fi

  verify:
    needs: guard
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded

  android:
    needs: verify
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Require the signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set for this environment"
              missing=1
            fi
          done
          if [ "$missing" != 0 ]; then
            echo "Refusing to publish: a release must be signed with the release keystore."
            exit 1
          fi

      - run: python3 scripts/scaffold_platforms.py android

      - run: flutter pub get
      - run: flutter build apk --release

      # Signed after the build rather than through a signing config injected into
      # the generated build.gradle.kts: the injection failed in CI and would have
      # to track Flutter's template shape. These are the same commands that were
      # verified against the real key on the phone.
      - name: Re-sign with the release key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$tools/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass "pass:$STORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "$RUNNER_TEMP/signed.apk" "$RUNNER_TEMP/aligned.apk"
          mv "$RUNNER_TEMP/signed.apk" "$apk"

      - name: Verify the signature
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          if grep -qi 'android debug' certs.txt; then
            echo "::error::the APK is signed with the debug key; refusing to publish"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # libsecret-1-dev and libjsoncpp-dev are what flutter_secure_storage's
      # Linux plugin finds through pkg-config; without them the CMake configure
      # step of `flutter build linux` fails outright on a clean runner.
      # rpm and libarchive-tools carry rpmbuild and bsdtar for packaging.
      - run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev \
            libsecret-1-dev libjsoncpp-dev rpm libarchive-tools

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: python3 scripts/scaffold_platforms.py linux
      - run: flutter pub get
      - run: flutter build linux --release
      - run: scripts/package_linux.sh build/linux/x64/release/bundle "${GITHUB_REF_NAME#v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install the packaging tools
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          dotnet tool install --global wix --version 4.*

      - shell: bash
        run: python scripts/scaffold_platforms.py windows
      - shell: bash
        run: flutter pub get
      - shell: bash
        run: flutter build windows --release
      - shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v', ''
          ./scripts/package_windows.ps1 -Bundle build/windows/x64/runner/Release `
            -Version $version -Out dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: python3 scripts/scaffold_platforms.py macos
      - run: flutter pub get
      - run: flutter build macos --release
      - run: scripts/package_macos.sh build/macos/Build/Products/Release/imagyn.app "${GITHUB_REF_NAME#v}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [android, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Source archive
        # GPL-3.0 requires offering the corresponding source alongside the
        # binaries, and this is that offer.
        run: |
          version="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz --prefix="imagyn-$version/" \
            -o "dist/imagyn-$version-source.tar.gz" HEAD

      - name: Checksums
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          # A draft, so the signature status and the asset list can be read
          # through before anyone downloads them.
          draft: true
          name: Imagyn ${{ github.ref_name }}
          body: |
            映想 Imagyn ${{ github.ref_name }}

            **本次更新**
            - **演示文稿编辑**：`move_slide` 调页序、`update_text` 改文案与样式、纯色页背景；文本框支持字体、斜体、内边距与行距，单页自由元素上限提升到 24。
            - **艺术文本框**：`add_text` / `update_text` 新增渐变第二色、阴影、±45° 旋转与字距，导出的 .pptx 与预览一致。
            - **一页两张表**：`add_table` 新增 `table_index`（-1 追加、0/1 替换），两张表上下堆叠。
            - **演讲者备注**：新工具 `set_notes`，备注显示在工作台大图下方，并写入 .pptx 的备注页。
            - **项目符号层级**：`bullet_levels`（0–2）导出为 DrawingML 的层级与缩进。
            - **导入 .pptx**：演示文稿列表新增入口，把已有演示文稿的文本、图片、表格、备注与纯色背景读回可编辑 deck；图片存入本地资源库，单文件上限 40 MB。
            - **导入文件**：Agent 输入区可导入图片、纯文本（txt/json/toml/markdown/yaml/csv/代码等）与 .docx/.pptx/.xlsx；文字以 `<file>` 块随消息送入，单文件 4 MB / 2 万字符，一次最多 6 个。

            **验证范围**
            - 静态分析零告警；**209 项**离线测试通过（CI 实测）。
            - **未实机验证**：导入的 .pptx 在 WPS / PowerPoint 里的版式保真度、备注页显示、复杂母版占位符页面的回读；文件导入的中文编码与大文件截断。装好后各试一次。

            **签名状态 / Signing**
            - Android APK — signed with the release keystore.
            - Windows MSI + EXE, macOS DMG + PKG, Linux deb + rpm + Arch — **unsigned**.
              Windows SmartScreen warns about an unknown publisher and macOS Gatekeeper
              needs a right-click to open. Removing that needs an Authenticode
              certificate and an Apple Developer ID, neither of which exists yet.
            - Windows is 64-bit only: Flutter ships no 32-bit Windows embedder.

            **许可证 / License**: GPL-3.0-or-later. The corresponding source is attached
            as a `*-source.tar.gz` archive, as the GPL requires.

            **校验 / Checksums**: see `SHA256SUMS`.
          files: dist/*
